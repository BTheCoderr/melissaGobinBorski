<!doctype html>
<!--
  Netlify Forms (OpenNext / Next.js): deploy-time registration only.
  Live form posts here via fetch from components/contact-form.tsx.
  https://opennext.js.org/netlify/forms
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Form definitions</title>
  </head>
  <body>
    <form
      name="contact"
      method="POST"
      netlify
      data-netlify="true"
      data-netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="contact" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>
  </body>
</html>
